[package]
name = "classitunes"
version = "2.0.3"
description = "ClassiTunes Music Player"
authors = ["Z Software Labs"]
edition = "2021"

[lib]
name = "classitunes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
id3 = "1.16"
mp4ameta = "0.13"
tauri-plugin-process = "2"
tiny_http = "0.12"
lofty = "0.25.3"
rayon = "1.10"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "all-meta", "adpcm", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"] }
cpal = "0.15.3"
rustfft = "6.4.1"
bincode = { version = "2.0.1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
incremental = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
] }
